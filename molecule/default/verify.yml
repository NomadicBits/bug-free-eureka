---
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Check if Flatpak is installed
      ansible.builtin.command: flatpak --version
      register: flatpak_check
      failed_when: false
      changed_when: false

    - name: Assert Flatpak is installed on Bazzite and Fedora
      ansible.builtin.assert:
        that:
          - flatpak_check.rc == 0
        fail_msg: "Flatpak should be installed on {{ ansible_distribution }}"
      when: ansible_distribution == "Fedora"

    - name: Check if Homebrew is installed (optional check)
      ansible.builtin.command: brew --version
      register: brew_check
      failed_when: false
      changed_when: false
      # We don't assert brew here because it's installed in the converge step 
      # and might fail in a container without proper setup.
